[project]
name = "floating-trash-refactored"
version = "0.1.0"
description = "Presentation-oriented floating-trash research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics[export]",
    "pydantic>=2.0",
    "pyyaml",
    "numpy",
    "opencv-python>=4.9",
    "boxmot",
    "trackeval",
    "pycocotools>=2.0.7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floating_trash*"]

[tool.uv.sources]
ultralytics = { git = "https://github.com/MuhRaflyArj/ultralytics-fhd.git" }
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval.git" }

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
